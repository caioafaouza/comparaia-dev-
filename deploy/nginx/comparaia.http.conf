# Nginx HTTP Configuration for Compara IA
# Location: /etc/nginx/sites-available/comparaia.http.conf
# Enable: ln -s /etc/nginx/sites-available/comparaia.http.conf /etc/nginx/sites-enabled/

upstream comparaia_api {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name comparaia.example.com;
    
    # Logs
    access_log /var/log/nginx/comparaia-access.log;
    error_log /var/log/nginx/comparaia-error.log;
    
    # Max upload size
    client_max_body_size 20M;
    
    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss;
    
    # Frontend static files
    root /var/www/comparaia/dist;
    index index.html;
    
    # API proxy
    location /api/ {
        proxy_pass http://comparaia_api;
        proxy_http_version 1.1;
        
        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
    
    # Health check
    location /health {
        proxy_pass http://comparaia_api/health;
        proxy_http_version 1.1;
        access_log off;
    }
    
    # Frontend routes (SPA)
    location / {
        try_files $uri $uri/ /index.html;
        
        # Cache control for HTML
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    
    # Static assets caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
