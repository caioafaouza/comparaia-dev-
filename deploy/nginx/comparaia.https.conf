# Nginx HTTPS Configuration for Compara IA (with Let's Encrypt)
# Location: /etc/nginx/sites-available/comparaia.https.conf
# Enable: ln -s /etc/nginx/sites-available/comparaia.https.conf /etc/nginx/sites-enabled/
# Cert: certbot --nginx -d comparaia.example.com

upstream comparaia_api {
    server 127.0.0.1:3000;
    keepalive 32;
}

# HTTP -> HTTPS redirect
server {
    listen 80;
    server_name comparaia.example.com;
    return 301 https://$server_name$request_uri;
}

# HTTPS server
server {
    listen 443 ssl http2;
    server_name comparaia.example.com;
    
    # SSL certificates (certbot will fill these)
    ssl_certificate /etc/letsencrypt/live/comparaia.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/comparaia.example.com/privkey.pem;
    
    # SSL config
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # Logs
    access_log /var/log/nginx/comparaia-access.log;
    error_log /var/log/nginx/comparaia-error.log;
    
    # Max upload size
    client_max_body_size 20M;
    
    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss;
    
    # Frontend static files
    root /var/www/comparaia/dist;
    index index.html;
    
    # API proxy
    location /api/ {
        proxy_pass http://comparaia_api;
        proxy_http_version 1.1;
        
        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
    
    # Health check
    location /health {
        proxy_pass http://comparaia_api/health;
        proxy_http_version 1.1;
        access_log off;
    }
    
    # Frontend routes (SPA)
    location / {
        try_files $uri $uri/ /index.html;
        
        # Cache control for HTML
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        
        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
    }
    
    # Static assets caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
